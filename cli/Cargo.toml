[package]
name = "blueprint"
version = "0.1.0"
edition = "2021"
description = "AI scaffolder: plan → preview → apply. Turn one prompt into a runnable project."
license = "MIT"
repository = "https://github.com/jiffyaneesh/ai-structure-gen"

[[bin]]
name = "bp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
