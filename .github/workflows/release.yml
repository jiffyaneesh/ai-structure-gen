name: release

# Build the `bp` binary for each platform and attach to the GitHub Release
# created by pushing a tag like `v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      # Package the binary as bp-<target>(.exe) so release assets don't collide.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: cp cli/target/${{ matrix.target }}/release/bp bp-${{ matrix.target }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: copy cli\target\${{ matrix.target }}\release\bp.exe bp-${{ matrix.target }}.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: bp-${{ matrix.target }}*
